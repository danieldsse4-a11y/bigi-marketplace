<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ביגי ספקים">
<meta property="og:locale" content="he_IL">
<meta property="og:title" content="פרופיל ספק — ביגי ספקים">
<meta property="og:description" content="פרופיל ספק אירועים בביגי ספקים — תמונות, חבילות ויצירת קשר ישיר בוואטסאפ.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<body>

<div class="vendor-page-bg"></div>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo">ביגי ספקים<span class="dot">.</span></a>
    <nav class="main-nav">
      <a href="index.html">בית</a>
      <a href="vendors.html" class="active">כל הספקים</a>
      <a href="join.html">הצטרפות כספק</a>
    </nav>
    <div class="header-actions">
      <a href="favorites.html" class="nav-fav-link" aria-label="המועדפים שלי">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7.6-4.6-10.2-9.6C.2 7.2 2.4 3.2 6.6 3.2c2.1 0 3.7 1.1 5.4 3 1.7-1.9 3.3-3 5.4-3 4.2 0 6.4 4 4.8 8.2C19.6 16.4 12 21 12 21z" stroke-linejoin="round"/></svg>
        <span class="nav-fav-count" hidden>0</span>
      </a>
      <a href="vendors.html" class="compare-pill" id="compare-pill" hidden>
        ⇄ השוואה <span class="count" id="compare-pill-count">0</span>
      </a>
      <a href="/admin-suppliers" class="nav-text-link" data-admin-only hidden>🔐 ניהול ספקים</a>
      <a href="login.html" class="btn btn-primary btn-sm" data-auth-guest>התחברות</a>
      <div class="account-menu" data-auth-user hidden>
        <button type="button" class="account-btn" aria-haspopup="menu" aria-expanded="false">
          <span class="account-avatar" aria-hidden="true"></span>
          <span class="account-name"></span>
          <svg class="account-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="account-dropdown" role="menu" hidden>
          <div class="account-dropdown-head">
            <strong class="account-name"></strong>
            <span class="account-email"></span>
          </div>
          <a href="dashboard.html" role="menuitem" data-role-supplier hidden>📊 לוח בקרה</a>
          <a href="favorites.html" role="menuitem">❤️ המועדפים שלי</a>
          <a href="/admin-suppliers" role="menuitem" data-admin-only hidden>🔐 ניהול ספקים</a>
          <button type="button" role="menuitem" data-admin-confirm hidden>🔐 שליחת קישור לאישור הרשאות מנהל</button>
          <button type="button" role="menuitem" class="account-logout" data-logout>יציאה מהחשבון</button>
        </div>
      </div>
      <button class="nav-toggle" aria-label="תפריט"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div id="vendor-profile">

  <section class="profile-hero">
    <div class="wrap profile-hero-inner">
      <div class="profile-avatar" id="profile-avatar"></div>
      <div>
        <h1 id="profile-name"></h1>
        <div class="profile-hero-meta">
          <span id="profile-tag"></span>
          <span id="profile-city"></span>
          <span id="profile-rating"></span>
        </div>
        <div class="profile-badges" id="profile-badges"></div>
        <div class="profile-hero-actions">
          <a href="#" id="profile-whatsapp-btn" target="_blank" rel="noopener" class="btn whatsapp-cta">צרו קשר בוואטסאפ</a>
        </div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="profile-card">
      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="gallery">תמונות</button>
        <button class="tab-btn" data-tab="packages">חבילות</button>
        <button class="tab-btn" data-tab="reviews">ביקורות</button>
      </div>

      <div class="tab-panel active" id="panel-gallery">
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>

      <div class="tab-panel" id="panel-packages">
        <div class="packages-grid" id="packages-grid"></div>
      </div>

      <div class="tab-panel" id="panel-reviews">
        <div id="reviews-list"></div>
      </div>
    </div>
  </div>

  <div class="floating-actions">
    <button class="floating-fav-btn" id="floating-fav" aria-label="הוסיפו למועדפים">🤍</button>
    <button class="floating-compare-btn" id="floating-compare">⇄ <span>הוסיפו להשוואה</span></button>
  </div>

</div>

<footer class="site-footer" style="margin-top:60px; padding-top:32px;">
  <div class="wrap">
    <div class="footer-bottom">
      <span>© 2026 ביגי ספקים. כל הזכויות שמורות.</span>
      <span>תנאי שימוש · פרטיות</span>
    </div>
  </div>
</footer>

<script src="data.js"></script>
<script src="site.js"></script>
</body>
</html>
