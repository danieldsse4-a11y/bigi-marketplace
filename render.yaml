services:
  - type: web
    name: bigi-supplier-marketplace
    runtime: node
    plan: free
    rootDir: bigi-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: ADMIN_EMAILS
        value: daniel.dsse4@gmail.com,gormoevents@gmail.com
      - key: EMAIL_FROM
        value: "Bigi Admin <onboarding@resend.dev>"
      - key: SESSION_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
